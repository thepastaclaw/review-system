<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PastaClaw Review Status</title><style>body{font:15px system-ui;margin:2rem;max-width:1100px;color:#202124}h1{margin-bottom:.2rem}.muted{color:#667085}.cards{display:flex;flex-wrap:wrap;gap:12px;margin:1rem 0}.card{border:1px solid #ddd;border-radius:10px;padding:14px;min-width:130px}.value{font-size:1.7rem;font-weight:700}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}.ok{color:#087f5b}.bad{color:#c92a2a}code{font-size:.9em}</style><h1>PastaClaw Review Status</h1><div id="meta" class="muted">Loading…</div><div id="app"></div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function age(s){if(s==null)return '—';let m=Math.floor(s/60);return m<60?m+'m':Math.floor(m/60)+'h '+m%60+'m'}function table(rows,cols){if(!rows?.length)return '<p class=muted>None</p>';return '<table><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(c.endsWith('_seconds')?age(r[c]):r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}async function load(){try{let d=await fetch('data/status.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()),l=d.live,h=l.heads||{},w=l.watchdog||{};document.querySelector('#meta').innerHTML=`Data as of <code>${esc(d.data_as_of)}</code> · generated <code>${esc(d.generated_at)}</code> · ${w.ingest_stale||w.stuck?'<b class=bad>degraded</b>':'<b class=ok>healthy</b>'}`;let cards=[['Queued',h.queued||0],['Running',h.running||0],['Completed',h.done||0],['Failed',h.failed||0],['Findings',d.history.totals.findings],['Reviews',d.history.totals.reviews]];document.querySelector('#app').innerHTML='<div class=cards>'+cards.map(x=>`<div class=card><div>${x[0]}</div><div class=value>${x[1]}</div></div>`).join('')+'</div><h2>Active reviews</h2>'+table(l.active,['repo','number','phase','elapsed_seconds','heartbeat_age_seconds'])+'<h2>Queue</h2>'+table(l.queued,['repo','number','priority','trigger','age_seconds','sha'])+'<h2>Daily throughput</h2>'+table(d.history.daily,['day','reviews','avg_seconds'])+'<h2>Recent events</h2>'+table(d.history.recent_events,['ts','kind','repo','number','detail'])}catch(e){document.querySelector('#app').innerHTML='<p class=bad>Unable to load status data.</p>'}}load();setInterval(load,60000);</script>
