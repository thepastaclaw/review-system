<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PastaClaw · Review Operations</title><style>:root{--bg:#0b1020;--panel:#131b31;--line:#263252;--text:#eef2ff;--muted:#91a0c2;--blue:#7c9cff;--green:#43d19e;--red:#ff6f86;--amber:#ffc86b}@media(prefers-color-scheme:light){:root{--bg:#f4f7fb;--panel:#fff;--line:#d9e1ef;--text:#182033;--muted:#63708a;--blue:#4263c5;--green:#087f5b;--red:#c92a2a;--amber:#9a6400}body{background:linear-gradient(140deg,#e8efff,#f8fafc 55%,#eef3fb)}.card,.panel{background:#fff;box-shadow:0 10px 28px #25385818}.item{background:#f8faff;border-color:#e2e8f5}.pill{background:#e8edff;color:#334a9a}}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 420px at 15% -10%,#1e315f 0%,transparent 65%),var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:42px 28px 72px}.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px}.eyebrow{color:var(--blue);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px}h1{font-size:34px;line-height:1.1;margin:7px 0}.sub,.muted{color:var(--muted)}.status{border:1px solid #2e6d5b;background:#12372f;color:var(--green);padding:8px 13px;border-radius:999px;font-weight:700}.status.bad{border-color:#703346;background:#401d2b;color:var(--red)}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:26px}.card,.panel{background:linear-gradient(145deg,#182340,#11192e);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px #05091455}.card{padding:18px}.label{color:var(--muted);font-size:12px}.value{font-size:30px;font-weight:760;letter-spacing:-.04em;margin-top:6px}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.panel{padding:20px;margin-bottom:16px}.panel h2{font-size:17px;margin:0 0 15px}.panel h2 span{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}.queue{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 14px;background:#0f172b;border:1px solid #202c4a;border-radius:10px}.repo{font-weight:700}.repo a{color:inherit;text-decoration:none}.repo a:hover{color:var(--blue)}.actions{font-size:11px;margin-top:5px}.actions a{color:var(--blue);text-decoration:none}.title{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:480px}.pill{font-size:11px;border-radius:999px;padding:4px 8px;background:#24345d;color:#b7c8ff;white-space:nowrap}.pill.priority{background:#4c3820;color:var(--amber)}.time{text-align:right;white-space:nowrap}.time strong{display:block}.metric{display:flex;justify-content:space-between;color:var(--muted);padding:7px 0;border-bottom:1px solid #202b47}.metric b{color:var(--text)}code{color:#b7c8ff;font-size:12px}.foot{color:var(--muted);font-size:12px;margin-top:10px}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:560px){main{padding:25px 14px}.top{display:block}.status{display:inline-block;margin-top:15px}.cards{grid-template-columns:repeat(2,1fr)}h1{font-size:28px}.item{align-items:flex-start;flex-direction:column;gap:6px}.time{text-align:left}}
</style><main><header class="top"><div><div class="eyebrow">PastaClaw · Review operations</div><h1>Review control room</h1><div id="meta" class="sub">Loading live telemetry…</div></div><div id="status" class="status">● CONNECTING</div></header><section id="cards" class="cards"></section><div class="layout"><div><section class="panel"><h2>Queue <span id="queue-count"></span></h2><div id="queue" class="queue"></div></section><section class="panel"><h2>Recent throughput</h2><div id="daily"></div></section></div><div><section class="panel"><h2>Active runs <span id="active-count"></span></h2><div id="active" class="queue"></div></section><section class="panel"><h2>System health</h2><div id="health"></div></section><section class="panel"><h2>Recent events</h2><div id="events"></div></section><section class="panel"><h2>Token usage</h2><div id="tokens"></div></section></div></div><div class="foot">Auto-refreshes every 60 seconds · Derived from the private review database · <span id="updated"></span></div></main><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),age=s=>{if(s==null)return'—';let m=Math.floor(s/60);return m<60?m+'m':Math.floor(m/60)+'h '+m%60+'m'},rows=(a,fn,empty='Nothing to show')=>a?.length?a.map(fn).join(''):`<div class="muted">${empty}</div>`;async function load(){try{const d=await fetch('data/status.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()),l=d.live||{},h=l.heads||{},w=l.watchdog||{};$('#meta').innerHTML=`Live as of <code>${esc(d.data_as_of)}</code> · ${w.ingest_stale||w.stuck?'attention required':'all systems nominal'}`;$('#status').textContent=w.ingest_stale||w.stuck?'● DEGRADED':'● OPERATIONAL';$('#status').className='status'+(w.ingest_stale||w.stuck?' bad':'');const cs=[['Queued',h.queued||0],['Running',h.running||0],['Completed',h.done||0],['Failed',h.failed||0],['Findings',d.history?.totals?.findings||0],['Reviews',d.history?.totals?.reviews||0]];$('#cards').innerHTML=cs.map(x=>`<div class=card><div class=label>${x[0]}</div><div class=value>${x[1].toLocaleString()}</div></div>`).join('');$('#queue-count').textContent=`${h.queued||0} waiting`;$('#queue').innerHTML=rows(l.queued,q=>`<div class=item><div><div class=repo><a href="${q.pr_url}">${esc(q.repo)} #${q.number}</a> <span class=pill>${esc(q.trigger)}</span></div><div class=title>${esc(q.title||q.sha.slice(0,8))}</div><div class=actions><a href="${q.pr_url}">Open PR</a> · <a href="${q.prioritize_url}">Prioritize</a></div></div><div class=time><strong>${age(q.age_seconds)}</strong><span class=muted>${q.eligible?q.priority?'<span class="pill priority">priority</span>':'ready':'<span class="pill">'+esc(q.reason)+'</span>'}</span></div></div>`);$('#active-count').textContent=`${l.active?.length||0} in flight`;$('#active').innerHTML=rows(l.active,a=>`<div class=item><div><div class=repo><a href="https://github.com/${a.repo}/pull/${a.number}">${esc(a.repo)} #${a.number}</a> <span class=pill>${esc(a.phase)}</span></div><div class=title>run ${a.id}</div></div><div class=time><strong>${age(a.elapsed_seconds)}</strong><span class=muted>heartbeat ${age(a.heartbeat_age_seconds)} ago</span></div></div>`,'No active reviews');$('#daily').innerHTML=rows((d.history?.daily||[]).slice(0,8),x=>`<div class=metric><span>${esc(x.day)}</span><b>${x.reviews} reviews · ${Math.round(x.avg_seconds/60)}m avg</b></div>`);$('#health').innerHTML=`<div class=metric><span>Ingest</span><b>${w.ingest_stale?'stale':'fresh'}</b></div><div class=metric><span>Eligible work</span><b>${w.eligible??0}</b></div><div class=metric><span>Active slots</span><b>${w.active??0}</b></div><div class=metric><span>Median run</span><b>${Math.round(l.median_run_minutes||0)}m</b></div>`;$('#events').innerHTML=rows((d.history?.recent_events||[]).slice(0,6),e=>`<div class=metric><span>${esc(e.kind)}</span><b>${esc(e.repo||'system')} ${e.number?'#'+e.number:''}</b></div>`);const t=d.history?.totals||{};$('#tokens').innerHTML=`<div class=metric><span>Total</span><b>${(t.tokens_total||0).toLocaleString()}</b></div><div class=metric><span>Input</span><b>${(t.tokens_in||0).toLocaleString()}</b></div><div class=metric><span>Output</span><b>${(t.tokens_out||0).toLocaleString()}</b></div>`+(d.history?.tokens_by_model||[]).slice(0,8).map(x=>`<div class=metric><span>${esc(x.model)}</span><b>${((x.tokens_in||0)+(x.tokens_out||0)).toLocaleString()}</b></div>`).join('');$('#updated').textContent='Last generated '+d.generated_at}catch(e){$('#status').textContent='● DATA UNAVAILABLE';$('#status').className='status bad';$('#meta').textContent='Unable to load live telemetry'}}load();setInterval(load,60000)</script>
